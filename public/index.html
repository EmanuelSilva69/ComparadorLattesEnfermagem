<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pós-Mestrado Pro</title>
    <style>
        :root {
            --bg-main: #0b0f17;
            --bg-card: #121b2d;
            --bg-card-hover: #162237;
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #10b981;
            --primary-hover: #059669;
            --secondary: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

        body { background-color: var(--bg-main); color: var(--text-main); padding: 2rem; }

        header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .action-bar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 1.2rem;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .controls-group { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }

        input {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            outline: none;
        }
        
        input:focus { border-color: var(--primary); }

        #buscaNome { width: 280px; }

        button {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 0.6rem 1.3rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            transition: all 0.2s ease;
        }

        button:hover { transform: translateY(-1px); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4); }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            box-shadow: none;
        }
        .btn-outline:hover { background: #1e293b; color: #fff; box-shadow: none; border-color: #334155; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.3rem 1.5rem;
        }

        .card span { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .card h2 { font-size: 1.8rem; margin-top: 0.3rem; font-weight: 800; }
        .card h2.json-count { color: var(--primary); }
        .card h2.html-count { color: var(--secondary); }

        .turma-section {
            margin-bottom: 2rem;
        }

        .turma-header {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            padding: 0.7rem 1.2rem;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px 8px 0 0;
            border-bottom: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .turma-header .count {
            font-size: 0.8rem;
            font-weight: 500;
            color: #64748b;
        }

        table { width: 100%; border-collapse: collapse; background: var(--bg-card); text-align: left; }
        th, td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
        th { background-color: #162032; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        .turma-section:last-child table tr:last-child td { border-radius: 0 0 8px 8px; }
        .turma-section:last-child .turma-header + table { border-radius: 0 0 8px 8px; overflow: hidden; }
        tr:hover { background-color: var(--bg-card-hover); }

        .badge { padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
        .badge-lattes { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
        .badge-escavador { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25); }
        .badge-none { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.15); }

        .btn-analisar {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-analisar:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: var(--text-muted); animation: spin 0.8s linear infinite; margin-right: 6px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .defesa-label {
            font-family: monospace;
            font-size: 0.8rem;
        }
        .defesa-em-andamento {
            color: #f59e0b;
            font-weight: 600;
        }
        .defesa-concluida {
            color: var(--text-muted);
        }

        .resumo-cell {
            line-height: 1.5;
            color: #cbd5e1;
            font-size: 0.85rem;
        }
        .resumo-placeholder {
            color: #475569;
            font-style: italic;
        }

        .filter-bar {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .filter-bar label {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        select {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
        }
        select:focus { border-color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <h1>Scanner de Atividades Pós-Mestrado</h1>
    </header>

    <div class="action-bar">
        <div class="controls-group">
            <input type="text" id="buscaNome" placeholder="Buscar aluno..." oninput="filtrarTabela()">
            <div class="filter-bar">
                <label>Fonte:</label>
                <select id="filtroOrigem" onchange="filtrarTabela()">
                    <option value="todas">Todas</option>
                    <option value="json">JSON (Lattes)</option>
                    <option value="html">HTML (Escavador)</option>
                    <option value="none">Nenhuma</option>
                </select>
            </div>
            <div class="filter-bar">
                <label>Turma:</label>
                <select id="filtroTurma" onchange="filtrarTabela()">
                    <option value="todas">Todas</option>
                </select>
            </div>
            <div class="filter-bar">
                <label>Modelo:</label>
                <select id="seletorModelo">
                    <option value="phi3">Phi-3.5 (3.8B)</option>
                    <option value="vibethinker">VibeThinker-3B</option>
                </select>
            </div>
        </div>
        <div class="controls-group">
            <button class="btn-outline" onclick="dispararAtualizacao('lattes')">Atualizar JSONs (Lattes)</button>
            <button class="btn-outline" onclick="dispararAtualizacao('escavador')">Atualizar HTMLs (Escavador)</button>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="card"><span>Alunos</span><h2 id="totalAlunos" style="color:#f8fafc;">-</h2></div>
        <div class="card"><span>Dados Lattes (JSON)</span><h2 id="totalJson" class="json-count">-</h2></div>
        <div class="card"><span>Dados Escavador (HTML)</span><h2 id="totalHtml" class="html-count">-</h2></div>
        <div class="card"><span>Sem Dados</span><h2 id="totalNone" style="color:#f87171;">-</h2></div>
    </div>

    <div id="tabelaContainer"></div>

    <script>
        const API_URL = window.location.origin + "/api";
        let listaAlunos = [];

        async function carregarBaseDados() {
            try {
                const res = await fetch(`${API_URL}/alunos`);
                listaAlunos = await res.json();

                const datalist = document.getElementById('listaNomesData');
                if (!datalist) {
                    const dl = document.createElement('datalist');
                    dl.id = 'listaNomesData';
                    document.body.appendChild(dl);
                }

                atualizarDashboard();
                popularFiltroTurma();
                renderizarTabela(listaAlunos);
            } catch (err) {
                console.error("Erro ao conectar com a API:", err);
            }
        }

        function atualizarDashboard() {
            const total = listaAlunos.length;
            const jsonCount = listaAlunos.filter(a => a.origem === 'json').length;
            const htmlCount = listaAlunos.filter(a => a.origem === 'html').length;
            const noneCount = listaAlunos.filter(a => a.origem === 'none').length;

            document.getElementById('totalAlunos').innerText = total;
            document.getElementById('totalJson').innerText = jsonCount;
            document.getElementById('totalHtml').innerText = htmlCount;
            document.getElementById('totalNone').innerText = noneCount;
        }

        function popularFiltroTurma() {
            const turmas = [...new Set(listaAlunos.map(a => a.turma))].sort((a, b) => a - b);
            const sel = document.getElementById('filtroTurma');
            turmas.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = `Turma ${t}`;
                sel.appendChild(opt);
            });
        }

        function filtrarTabela() {
            const busca = document.getElementById('buscaNome').value.trim().toUpperCase();
            const origemFiltro = document.getElementById('filtroOrigem').value;
            const turmaFiltro = document.getElementById('filtroTurma').value;

            let filtrados = listaAlunos;

            if (busca) {
                filtrados = filtrados.filter(a => a.nome.includes(busca));
            }
            if (origemFiltro !== 'todas') {
                filtrados = filtrados.filter(a => a.origem === origemFiltro);
            }
            if (turmaFiltro !== 'todas') {
                filtrados = filtrados.filter(a => a.turma === parseInt(turmaFiltro));
            }

            renderizarTabela(filtrados);
        }

        function renderizarTabela(alunos) {
            const container = document.getElementById('tabelaContainer');

            if (alunos.length === 0) {
                container.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:3rem;font-style:italic;">Nenhum aluno encontrado.</div>`;
                return;
            }

            const turmas = {};
            alunos.forEach(a => {
                const t = a.turma || 0;
                if (!turmas[t]) turmas[t] = [];
                turmas[t].push(a);
            });

            const turmaKeys = Object.keys(turmas).sort((a, b) => a - b);

            let html = '';
            for (const key of turmaKeys) {
                const alunosTurma = turmas[key];
                html += `<div class="turma-section">
                    <div class="turma-header">
                        <span>Turma ${key}</span>
                        <span class="count">${alunosTurma.length} aluno(s)</span>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th style="width:35%">Nome</th>
                                <th style="width:15%">Defesa</th>
                                <th style="width:15%">Origem</th>
                                <th style="width:35%">Resumo</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                for (const aluno of alunosTurma) {
                    const defesaHtml = aluno.defesa === 'EM ANDAMENTO'
                        ? `<span class="defesa-label defesa-em-andamento">EM ANDAMENTO</span>`
                        : `<span class="defesa-label defesa-concluida">${aluno.defesa}</span>`;

                    const badgeClass = aluno.origem === 'json' ? 'badge-lattes'
                        : aluno.origem === 'html' ? 'badge-escavador' : 'badge-none';
                    const badgeLabel = aluno.origem === 'json' ? 'JSON (Lattes)'
                        : aluno.origem === 'html' ? 'HTML (Escavador)' : 'Nenhum';
                    const badgeIcon = aluno.origem === 'json' ? '📄'
                        : aluno.origem === 'html' ? '🌐' : '—';

                    html += `<tr>
                        <td><strong style="color:#fff;">${aluno.nome}</strong></td>
                        <td>${defesaHtml}</td>
                        <td><span class="badge ${badgeClass}">${badgeIcon} ${badgeLabel}</span></td>
                        <td class="resumo-cell resumo-placeholder">
                            <button class="btn-analisar" onclick="analisarAluno('${aluno.nome.replace(/'/g, "\\'")}')">Analisar</button>
                        </td>
                    </tr>`;
                }
                html += `</tbody></table></div>`;
            }

            container.innerHTML = html;
        }

        async function analisarAluno(nome) {
            const container = document.getElementById('tabelaContainer');
            const allRows = container.querySelectorAll('tr');
            let targetRow = null;
            for (const row of allRows) {
                if (row.cells && row.cells[0] && row.cells[0].innerText.trim() === nome) {
                    targetRow = row;
                    break;
                }
            }

            if (!targetRow) return;

            const modelo = document.getElementById('seletorModelo').value;
            const modeloLabel = document.getElementById('seletorModelo').selectedOptions[0].text;

            const resumoCell = targetRow.cells[3];
            const btn = resumoCell.querySelector('.btn-analisar');
            if (btn) btn.remove();
            resumoCell.innerHTML = `<span class="spinner"></span> Analisando (${modeloLabel})...`;
            resumoCell.classList.remove('resumo-placeholder');

            try {
                const res = await fetch(`${API_URL}/analisar/${encodeURIComponent(nome)}?modelo=${modelo}`);
                const resultado = await res.json();
                const textoResumo = resultado.resumo || resultado.resumo_ia || "Nenhum resumo gerado.";
                resumoCell.innerHTML = `<span style="font-size:0.7rem;color:#64748b;display:block;margin-bottom:4px;">Modelo: ${modeloLabel}</span>${textoResumo}`;
            } catch (e) {
                resumoCell.innerText = "Falha crítica de comunicação.";
            }
        }

        async function dispararAtualizacao(alvo) {
            const url = alvo === 'lattes' ? '/update/lattes' : '/update/escavador';
            try {
                await fetch(`${API_URL}${url}`, { method: 'POST' });
                alert(`Comando enviado com sucesso!\nO processo do ${alvo.toUpperCase()} está rodando em segundo plano.`);
            } catch (e) {
                alert("Erro ao tentar acionar o script.");
            }
        }

        window.onload = carregarBaseDados;
    </script>
</body>
</html>
