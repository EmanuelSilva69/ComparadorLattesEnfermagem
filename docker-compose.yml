version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build: .
    container_name: scanner-pos-mestrado
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./escavador_perfis:/app/escavador_perfis
      - ./mapeamento_lattes.json:/app/mapeamento_lattes.json
      - ./academicData.ts:/app/academicData.ts

volumes:
  ollama_data:
